# GitHub Copilot CLI.
#
# Flags verified against `copilot --help` on 2026-09-08.
kind: factory.provider/v1
id: copilot
displayName: GitHub Copilot
summary: GitHub's coding agent.
command: copilot
install: npm install -g @github/copilot
docs: https://docs.github.com/en/copilot/concepts/agents/about-copilot-cli

supports:
  - non_interactive
  - session_resume
  - tool_use
  - file_access
  - mcp

# Copilot's `--model` takes a concrete id, not a tier alias, so these need
# checking when GitHub retires one — the CLI validates the value and exits
# immediately, which at least fails fast and clearly.
#
# `claude-opus-5` was retired by GitHub, reported 2026-09-25. Its replacement was
# first written `claude-opus-5-5`, which the CLI refused outright:
#
#   Error: Model "claude-opus-5-5" from --model flag is not available.
#
# **A point release dots the minor version here; it does not hyphenate it.**
# Confirmed against the ids this machine's own Copilot sessions have recorded —
# `gpt-5.4-nano`, `gpt-5.6-sol`, `gpt-5.6-terra` — every one dotting the minor
# version while hyphenating the name. `claude-opus-5` and `claude-sonnet-5` have
# no minor part, which is why nothing here showed the convention until one was
# needed.
#
# This field is the one in this file that **cannot be checked from a terminal**.
# There is no `models` subcommand, `--help` says only `--model <model>`, and the
# CLI will not validate the flag without an interactive session — probed with a
# scrubbed environment, with Factory's own argv, and under a pty, exiting before
# reading the flag every time. So it is maintained by running it for real and
# reading the error.
models:
  strong: claude-opus-5.5
  balanced: claude-sonnet-5
  fast: claude-haiku-4-5

promptFlag: '-p'
modelFlag: '--model'
# No effort setting; a phase that sets one gets a doctor warning rather than
# silently having it ignored.
subagentFlag: '--agent'

session:
  # `--continue` resumes the most recent session *globally*, which would let two
  # tasks running in parallel contaminate each other. An explicit id keeps them
  # apart while still carrying context forward.
  #
  # No `resumeFlag`: `--session-id` both sets the UUID of a new session and
  # resumes one by id, which is what `resumeFlag` falling back to `idFlag` is
  # for. This descriptor is unchanged — what changed is that something now
  # supplies an id, so `session_resume` finally does anything here.
  mode: id
  idFlag: '--session-id'

# --allow-all-tools is required for non-interactive use, and --no-ask-user stops
# the agent blocking forever on a question nobody is there to answer.
#
# The Default profile is the old list minus two flags, which is why it is a
# smaller claim than Claude's and a safer change: `--allow-all-paths` is
# documented as "Disable file path verification and allow access to any path",
# and `--allow-all-urls` does the same for the network. Passing them meant
# Factory switched off the confinement this CLI already had. Not passing them
# leaves it on.
#
# Not probed against the real CLI — that needs a GitHub login and spends the
# user's Copilot quota — but there is nothing ambiguous to probe: these are
# flags being *withheld*, and `--allow-all-tools` is unchanged and known to
# work. docs/security/providers.md says exactly this.
permissionArgs:
  default: ['--allow-all-tools']
  full-access: ['--allow-all']

# Arguments a step may not pass under a confined profile, on top of `--allow-all`
# derived from the list above.
#
# These are the two the Default profile deliberately stopped passing. A step
# that passed one itself would put back exactly the confinement this provider
# was changed to stop switching off — and it would do it from a file in the
# repository, with no setting changed and nothing said.
forbiddenArgs: ['--allow-all-paths', '--allow-all-urls']

# Documented as "Allow file access to a directory"; Factory uses it for the
# artifacts root, which lives outside the worktree by design.
directoryFlag: '--add-dir'
extraArgs: ['--no-color', '--no-ask-user', '--log-level', 'none']

stdin: /dev/null
env: {}

# Survives the Default profile's credential filter. Both spellings, because the
# CLI and `gh` disagree about which one they read and a descriptor that named
# only one would authenticate on some machines and not others.
#
# Note what this necessarily allows: a Copilot step can reach GitHub with the
# user's own token, so pushing from inside that step is possible. That is the
# cost of the provider needing the credential at all, and it is written down in
# docs/security/providers.md rather than implied.
passEnv: ['GH_TOKEN', 'GITHUB_TOKEN']

# None, because nothing has been observed. This CLI verifies file paths by
# default — that is why the Default profile stops passing `--allow-all-paths` —
# but how it words a refusal has not been seen, and inventing the words would
# produce a detector that either never fires or fires on prose. It reports
# nothing until somebody runs it and reads the output.
denialPatterns: []
